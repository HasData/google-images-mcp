[project]
name = "hasdata-google-images-mcp"
version = "1.0.0"
description = "MCP server for Google Images through HasData's hosted API. 1,000 free credits every month."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp","google-images","image-search","serp","seo","model-context-protocol","hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.17,<2"]

[project.urls]
Homepage = "https://hasdata.com/apis/google-images-api"
Repository = "https://github.com/HasData/google-images-mcp"

[project.scripts]
hasdata-google-images-mcp = "hasdata_google_images_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_google_images_mcp"]
